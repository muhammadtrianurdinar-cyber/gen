name: Web2APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL Website'
        required: true
        type: string

      app_name:
        description: 'Nama Aplikasi'
        required: true
        type: string

      icon_url:
        description: 'Icon URL'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Create Flutter Project
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"

          flutter create \
            --org com.pegasus \
            --project-name app \
            myapp

      - name: Add Dependencies
        run: |
          cd myapp

          flutter pub add webview_flutter
          flutter pub add flutter_launcher_icons
          flutter pub add connectivity_plus

          mkdir -p assets/icon

      - name: Write main.dart
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          WEB_URL: ${{ github.event.inputs.web_url }}
        run: |
          python3 <<'PY'
          from pathlib import Path
          import os

          app_name = os.environ["APP_NAME"]
          web_url = os.environ["WEB_URL"]

          dart = r'''
          import 'dart:async';

          import 'package:connectivity_plus/connectivity_plus.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          const String appName = __APP_NAME__;
          const String webUrl = __WEB_URL__;

          void main() {
            WidgetsFlutterBinding.ensureInitialized();

            SystemChrome.setSystemUIOverlayStyle(
              const SystemUiOverlayStyle(
                statusBarColor: Colors.transparent,
                statusBarIconBrightness: Brightness.dark,
                statusBarBrightness: Brightness.light,
              ),
            );

            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: appName,
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  colorSchemeSeed: Colors.blue,
                ),
                home: const SplashScreen(),
              );
            }
          }

          class SplashScreen extends StatefulWidget {
            const SplashScreen({super.key});

            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen>
              with TickerProviderStateMixin {
            late final AnimationController _fadeController;
            late final AnimationController _scaleController;
            late final AnimationController _dotController;

            late final Animation<double> _fadeAnimation;
            late final Animation<double> _scaleAnimation;
            late final Animation<double> _dot1Animation;
            late final Animation<double> _dot2Animation;
            late final Animation<double> _dot3Animation;

            bool _isChecking = false;
            bool _dialogShown = false;

            @override
            void initState() {
              super.initState();

              _fadeController = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 800),
              );

              _scaleController = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 800),
              );

              _dotController = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 1200),
              )..repeat();

              _fadeAnimation = Tween<double>(
                begin: 0.0,
                end: 1.0,
              ).animate(
                CurvedAnimation(
                  parent: _fadeController,
                  curve: Curves.easeOut,
                ),
              );

              _scaleAnimation = Tween<double>(
                begin: 0.75,
                end: 1.0,
              ).animate(
                CurvedAnimation(
                  parent: _scaleController,
                  curve: Curves.easeOutBack,
                ),
              );

              _dot1Animation = TweenSequence<double>([
                TweenSequenceItem(
                  tween: Tween<double>(begin: 0.3, end: 1.0),
                  weight: 1,
                ),
                TweenSequenceItem(
                  tween: Tween<double>(begin: 1.0, end: 0.3),
                  weight: 1,
                ),
                TweenSequenceItem(
                  tween: const ConstantTween<double>(0.3),
                  weight: 1,
                ),
              ]).animate(
                CurvedAnimation(
                  parent: _dotController,
                  curve: Curves.easeInOut,
                ),
              );

              _dot2Animation = TweenSequence<double>([
                TweenSequenceItem(
                  tween: const ConstantTween<double>(0.3),
                  weight: 1,
                ),
                TweenSequenceItem(
                  tween: Tween<double>(begin: 0.3, end: 1.0),
                  weight: 1,
                ),
                TweenSequenceItem(
                  tween: Tween<double>(begin: 1.0, end: 0.3),
                  weight: 1,
                ),
              ]).animate(
                CurvedAnimation(
                  parent: _dotController,
                  curve: Curves.easeInOut,
                ),
              );

              _dot3Animation = TweenSequence<double>([
                TweenSequenceItem(
                  tween: Tween<double>(begin: 1.0, end: 0.3),
                  weight: 1,
                ),
                TweenSequenceItem(
                  tween: const ConstantTween<double>(0.3),
                  weight: 1,
                ),
                TweenSequenceItem(
                  tween: Tween<double>(begin: 0.3, end: 1.0),
                  weight: 1,
                ),
              ]).animate(
                CurvedAnimation(
                  parent: _dotController,
                  curve: Curves.easeInOut,
                ),
              );

              _fadeController.forward();
              _scaleController.forward();

              Timer(
                const Duration(milliseconds: 1500),
                _checkConnectionAndNavigate,
              );
            }

            Future<void> _checkConnectionAndNavigate() async {
              if (_isChecking || !mounted) return;

              setState(() {
                _isChecking = true;
              });

              await Future.delayed(
                const Duration(milliseconds: 700),
              );

              if (!mounted) return;

              try {
                final result =
                    await Connectivity().checkConnectivity();

                final hasConnection = result.any(
                  (item) => item != ConnectivityResult.none,
                );

                if (!hasConnection) {
                  setState(() {
                    _isChecking = false;
                  });

                  _showNoConnectionDialog();
                  return;
                }

                if (!mounted) return;

                Navigator.of(context).pushReplacement(
                  MaterialPageRoute(
                    builder: (_) => const WebViewPage(),
                  ),
                );
              } catch (_) {
                if (!mounted) return;

                setState(() {
                  _isChecking = false;
                });

                _showNoConnectionDialog();
              }
            }

            void _showNoConnectionDialog() {
              if (!mounted || _dialogShown) return;

              setState(() {
                _dialogShown = true;
              });

              showDialog<void>(
                context: context,
                barrierDismissible: false,
                builder: (context) {
                  return AlertDialog(
                    title: const Text('Gagal Terhubung'),
                    content: const Text(
                      'Tidak ada koneksi internet.',
                    ),
                    actions: [
                      TextButton(
                        onPressed: () {
                          Navigator.of(context).pop();

                          if (mounted) {
                            setState(() {
                              _dialogShown = false;
                            });
                          }

                          _checkConnectionAndNavigate();
                        },
                        child: const Text('Coba Lagi'),
                      ),
                    ],
                  );
                },
              );
            }

            @override
            void dispose() {
              _fadeController.dispose();
              _scaleController.dispose();
              _dotController.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: Center(
                  child: AnimatedBuilder(
                    animation: Listenable.merge([
                      _fadeController,
                      _scaleController,
                      _dotController,
                    ]),
                    builder: (context, child) {
                      return FadeTransition(
                        opacity: _fadeAnimation,
                        child: ScaleTransition(
                          scale: _scaleAnimation,
                          child: Column(
                            mainAxisSize: MainAxisSize.min,
                            children: [
                              Text(
                                appName,
                                textAlign: TextAlign.center,
                                style: const TextStyle(
                                  fontSize: 26,
                                  fontWeight: FontWeight.bold,
                                ),
                              ),

                              const SizedBox(height: 18),

                              Row(
                                mainAxisSize: MainAxisSize.min,
                                children: [
                                  _Dot(
                                    opacity: _dot1Animation.value,
                                  ),
                                  const SizedBox(width: 7),
                                  _Dot(
                                    opacity: _dot2Animation.value,
                                  ),
                                  const SizedBox(width: 7),
                                  _Dot(
                                    opacity: _dot3Animation.value,
                                  ),
                                ],
                              ),

                              const SizedBox(height: 18),

                              Text(
                                _isChecking
                                    ? 'Memeriksa koneksi...'
                                    : 'Memuat...',
                                style: TextStyle(
                                  color: Colors.grey.shade600,
                                  fontSize: 14,
                                ),
                              ),
                            ],
                          ),
                        ),
                      );
                    },
                  ),
                ),
              );
            }
          }

          class _Dot extends StatelessWidget {
            final double opacity;

            const _Dot({
              required this.opacity,
            });

            @override
            Widget build(BuildContext context) {
              return Opacity(
                opacity: opacity,
                child: Container(
                  width: 9,
                  height: 9,
                  decoration: const BoxDecoration(
                    color: Colors.blue,
                    shape: BoxShape.circle,
                  ),
                ),
              );
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});

            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage> {
            late final WebViewController _controller;

            @override
            void initState() {
              super.initState();

              _controller = WebViewController()
                ..setJavaScriptMode(
                  JavaScriptMode.unrestricted,
                )
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onWebResourceError: (error) {
                      debugPrint(
                        'WebView error: ${error.description}',
                      );
                    },
                  ),
                )
                ..loadRequest(
                  Uri.parse(webUrl),
                );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(
                  child: WebViewWidget(
                    controller: _controller,
                  ),
                ),
              );
            }
          }
          '''

          dart = dart.replace(
              "__APP_NAME__",
              repr(app_name).replace("\\'", "'"),
          )

          dart = dart.replace(
              "__WEB_URL__",
              repr(web_url).replace("\\'", "'"),
          )

          Path("myapp/lib/main.dart").write_text(
              dart,
              encoding="utf-8",
          )
          PY

      - name: Configure Android Permissions
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
        run: |
          MANIFEST="myapp/android/app/src/main/AndroidManifest.xml"

          python3 <<'PY'
          from pathlib import Path
          import os

          manifest = Path(
              "myapp/android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text(encoding="utf-8")

          internet = (
              '    <uses-permission '
              'android:name="android.permission.INTERNET"/>\n'
          )

          network = (
              '    <uses-permission '
              'android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
          )

          if 'android.permission.INTERNET' not in text:
              text = text.replace(
                  '<manifest',
                  '<manifest\n' + internet,
                  1,
              )

          if 'android.permission.ACCESS_NETWORK_STATE' not in text:
              text = text.replace(
                  '<manifest',
                  '<manifest\n' + network,
                  1,
              )

          manifest.write_text(
              text,
              encoding="utf-8",
          )
          PY

          echo "=== AndroidManifest ==="
          cat "$MANIFEST"

      - name: Download Icon
        env:
          ICON_URL: ${{ github.event.inputs.icon_url }}
        run: |
          mkdir -p myapp/assets/icon

          sudo apt-get update
          sudo apt-get install -y imagemagick

          echo "=== Downloading Icon ==="
          echo "URL: $ICON_URL"

          curl \
            -fL \
            --retry 3 \
            --connect-timeout 15 \
            --max-time 60 \
            "$ICON_URL" \
            -o myapp/assets/icon/icon_raw

          echo "=== File Info ==="
          file myapp/assets/icon/icon_raw
          ls -lh myapp/assets/icon/icon_raw

          FILE_TYPE=$(file --mime-type -b myapp/assets/icon/icon_raw)

          echo "Detected MIME: $FILE_TYPE"

          if echo "$FILE_TYPE" | grep -qE \
            "text/html|text/plain|application/json"; then

            echo "ERROR: Icon URL tidak menghasilkan file gambar."
            exit 1
          fi

          convert \
            myapp/assets/icon/icon_raw \
            -resize 1024x1024^ \
            -gravity center \
            -extent 1024x1024 \
            myapp/assets/icon/icon.png

          echo "Icon berhasil dikonversi."

      - name: Generate Launcher Icons
        run: |
          cat > myapp/flutter_launcher_icons.yaml << 'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/icon.png"
            min_sdk_android: 21
          EOF

          cd myapp

          dart run flutter_launcher_icons \
            -f flutter_launcher_icons.yaml

      - name: Verify Package ID
        run: |
          echo "=== Checking Android applicationId ==="

          grep -R \
            "com.pegasus.app" \
            myapp/android \
            || true

      - name: Analyze Flutter Project
        run: |
          cd myapp
          flutter pub get
          flutter analyze

      - name: Build APK
        run: |
          cd myapp
          flutter build apk --release

      - name: Rename APK
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"

          SAFE_NAME=$(echo "$APP_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | tr ' ' '_' \
            | tr -cd '[:alnum:]_-')

          cp \
            myapp/build/app/outputs/flutter-apk/app-release.apk \
            "myapp/build/app/outputs/flutter-apk/${SAFE_NAME}-release.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-release
          path: myapp/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error
